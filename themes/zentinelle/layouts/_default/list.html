{{ define "main" }}
<div style="max-width:48rem;margin:0 auto;padding:3rem 1.5rem">
  <a href="/" style="color:var(--color-zen-link);font-size:0.875rem;display:inline-block;margin-bottom:2rem">&larr; Back to home</a>
  <h1 style="font-size:2.25rem;font-weight:700;margin-bottom:3rem">{{ .Title }}</h1>
  {{ range .Pages }}
  <a href="{{ .Permalink }}" style="display:block;padding:1.5rem;border-radius:1rem;border:1px solid var(--color-zen-rule);margin-bottom:1.5rem;text-decoration:none;color:inherit">
    <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:0.5rem">{{ .Title }}</h2>
    {{ with .Params.description }}<p style="color:var(--color-zen-muted)">{{ . }}</p>{{ end }}
    {{ with .Date }}<time style="color:var(--color-zen-subtle);font-size:0.875rem;margin-top:0.75rem;display:block">{{ .Format "January 2, 2006" }}</time>{{ end }}
  </a>
  {{ end }}
</div>
{{ end }}
