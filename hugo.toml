baseURL = "https://zentinelle.ai/"
languageCode = "en-us"
title = "Zentinelle AI | Agent policy and observability"
theme = "zentinelle"
disableFastRender = true

[params]
  version = "1.3.0"
  description = "Evaluate policy and record activity through supported agent integrations. Review enforcement coverage and evidence for your deployment."
  github = "https://github.com/calliopeai/zentinelle"
  sdk = "https://github.com/calliopeai/zentinelle-sdk"
  docs = "https://zentinelle.dev"
  pypi = "https://pypi.org/project/zentinelle/"
  npm = "https://www.npmjs.com/package/zentinelle"
  # Public-facing portal that hosts the live demo iframe.
  # Override locally with HUGO_PARAMS_DEMOURL=http://localhost:8080
  demoUrl = "https://demo.zentinelle.dev"

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

ignoreLogs = ['warning-goldmark-raw-html']

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
