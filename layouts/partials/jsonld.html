{{- /* Organization @id matches calliope.ai's graph so all Calliope properties
       resolve to one publisher entity rather than separate organisations. */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    { "@type": "Organization", "@id": "https://calliope.ai/#organization",
      "name": "Calliope AI", "legalName": "Calliope Labs Inc", "url": "https://zentinelle.ai/",
      "sameAs": ["https://x.com/calliopelabs","https://www.linkedin.com/company/calliopelabsinc/","https://github.com/CalliopeAI"] },
    { "@type": "WebSite", "@id": "https://zentinelle.ai/#website", "url": "https://zentinelle.ai/",
      "name": {{ site.Title }}, "publisher": { "@id": "https://calliope.ai/#organization" } },
    { "@type": "SoftwareApplication", "@id": "https://zentinelle.ai/#app",
      "name": "Zentinelle AI", "applicationCategory": "SecurityApplication", "operatingSystem": "Web, Linux",
      "url": "https://zentinelle.ai/", "description": {{ site.Params.description }},
      "publisher": { "@id": "https://calliope.ai/#organization" } }
  ]
}
</script>
